<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>2차 컨펌 예약 결제</title>
<script src="4b8c1347-1bd9-4238-8790-7cd884ed6413"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Do+Hyeon&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFD23F}a:hover{color:#FFE27F}
</style>
</helmet>
<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background: #120D24; color: #F7F1E3; font-family: 'Noto Sans KR', sans-serif">

  <div aria-hidden="true" style="position: absolute; inset: 0; background-image: linear-gradient(#1B1436 2px, transparent 2px), linear-gradient(90deg, #1B1436 2px, transparent 2px); background-size: 32px 32px"></div>
  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(8,6,16,0.6)"></div>

  <div role="dialog" aria-labelledby="c2-title" style="position: absolute; left: 230px; top: 56px; width: 820px; box-sizing: border-box; padding: 32px; background: #1B1430; border: 4px solid #F7F1E3; box-shadow: 8px 8px 0 #5B4BB7; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-family: 'Press Start 2P', monospace; font-size: 11px; color: #FFD23F">CONFIRM 2/2</span>
      <div style="display: flex; gap: 6px"><span style="width: 28px; height: 8px; background: #FFD23F"></span><span style="width: 28px; height: 8px; background: #FFD23F"></span></div>
    </div>
    <div>
      <h2 id="c2-title" style="margin: 0; font-family: 'Do Hyeon', sans-serif; font-size: 34px; font-weight: 400; line-height: 40px">다온빌딩 던전 · 도전 예약</h2>
      <p style="margin: 6px 0 0; font-size: 15px; color: #CFC6E8">일반 이용객이 없는 개방 시간에만 예약할 수 있어요. 최소 30분 단위입니다.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <span style="font-size: 14px; font-weight: 700; color: #CFC6E8">11월 14일 (토) 개방 시간</span>
      <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{slots}}" as="s" hint-placeholder-count="7">
          <button type="button" aria-pressed="{{s.on}}" style="height: 52px; border: 3px solid {{s.border}}; background: {{s.bg}}; color: {{s.fg}}; font-family: 'Press Start 2P', monospace; font-size: 11px">{{s.t}}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px">
      <div style="padding: 18px; background: #120D24; border: 3px solid #3B2F66; display: flex; flex-direction: column; gap: 10px; font-size: 15px">
        <div style="display: flex; justify-content: space-between"><span style="color: #CFC6E8">일반 주차비</span><span>30분 2,500원</span></div>
        <div style="display: flex; justify-content: space-between"><span style="color: #CFC6E8">고수 모드 프리미엄</span><span>× 2.0</span></div>
        <div style="display: flex; justify-content: space-between"><span style="color: #CFC6E8">선택 시간</span><span>23:00–24:00 (60분)</span></div>
        <div style="height: 3px; background: #3B2F66"></div>
        <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-weight: 700">선결제 금액</span><span style="font-family: 'Press Start 2P', monospace; font-size: 16px; color: #FFD23F">10,000원</span></div>
      </div>
      <fieldset style="margin: 0; padding: 18px; border: 3px solid #FF8A3D; background: #241426; display: flex; flex-direction: column; gap: 12px">
        <legend style="padding: 0 6px; font-family: 'Do Hyeon', sans-serif; font-size: 18px; color: #FF8A3D">안전 수칙 동의</legend>
        <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 20px"><input type="checkbox" checked="" style="width: 20px; height: 20px; margin: 0; accent-color: #FF8A3D">저속(10km/h 이하)을 넘으면 미션이 자동 중단됩니다</label>
        <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 20px"><input type="checkbox" checked="" style="width: 20px; height: 20px; margin: 0; accent-color: #FF8A3D">주행 중에는 화면이 최소 표시로 바뀝니다</label>
        <label style="display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 20px"><input type="checkbox" style="width: 20px; height: 20px; margin: 0; accent-color: #FF8A3D">시설 파손 책임 규정을 확인했습니다</label>
      </fieldset>
    </div>

    <div style="display: flex; gap: 12px">
      <a href="Confirm1.dc.html" style="width: 200px; height: 64px; border: 4px solid #CFC6E8; color: #F7F1E3; font-family: 'Do Hyeon', sans-serif; font-size: 22px; text-decoration: none; display: flex; align-items: center; justify-content: center">이전</a>
      <a href="GameMap.dc.html" style="flex: 1; height: 64px; background: #FFD23F; color: #120D24; box-shadow: 6px 6px 0 #B8860B; font-family: 'Do Hyeon', sans-serif; font-size: 24px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 12px">결제하고 도전 시작 <span style="font-family: 'Press Start 2P', monospace; font-size: 14px">▶</span></a>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  renderVals() {
    var times = ['22:30', '23:00', '23:30', '00:00', '00:30', '01:00', '01:30'];
    var on = { '23:00': true, '23:30': true };
    var full = { '00:30': true };
    return {
      slots: times.map(function (t) {
        if (on[t]) return { t: t, on: 'true', bg: '#FFD23F', fg: '#120D24', border: '#FFD23F' };
        if (full[t]) return { t: t, on: 'false', bg: '#1B1430', fg: '#6E6490', border: '#2E2550' };
        return { t: t, on: 'false', bg: '#1B1430', fg: '#F7F1E3', border: '#5B4BB7' };
      })
    };
  }
}
</script>


</body></html>
