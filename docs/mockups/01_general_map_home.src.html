<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>일반 모드 지도 홈</title>
<script src="9f0588fe-fe4e-4d63-a4b3-dfbd7ec25754"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#4C9BFF}a:hover{color:#7DB6FF}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #0E1013; color: #F2F4F6; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 72px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 20px; border-bottom: 1px solid #262A31; background: #121418">
    <div style="display: flex; align-items: center; gap: 10px; min-width: 200px">
      <svg width="28" height="28" sc-camel-view-box="0 0 28 28" aria-hidden="true"><rect x="2" y="2" width="24" height="24" rx="6" fill="none" stroke="#F2F4F6" stroke-width="2"></rect><path d="M10 20V8h5a4 4 0 0 1 0 8h-5" fill="none" stroke="#F2F4F6" stroke-width="2"></path></svg>
      <span style="font-size: 20px; font-weight: 700; letter-spacing: -0.3px">고수의 주차장</span>
    </div>
    <label style="flex: 1; display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 16px; background: #1C2026; border-radius: 12px; color: #A9B0BA; font-size: 16px">
      <svg width="20" height="20" sc-camel-view-box="0 0 20 20" aria-hidden="true"><circle cx="9" cy="9" r="6" fill="none" stroke="#A9B0BA" stroke-width="2"></circle><path d="M14 14l4 4" stroke="#A9B0BA" stroke-width="2" stroke-linecap="round"></path></svg>
      <input type="text" value="테헤란로 거래처 미팅" aria-label="목적지 검색" style="flex: 1; background: transparent; border: 0; color: #F2F4F6; font: inherit; font-size: 16px; outline: none">
    </label>
    <div role="group" aria-label="모드 전환" style="display: flex; padding: 4px; background: #1C2026; border-radius: 12px; gap: 4px">
      <button type="button" style="height: 44px; padding: 0 20px; border: 0; border-radius: 9px; background: #F2F4F6; color: #0E1013; font: inherit; font-size: 15px; font-weight: 700">일반</button>
      <button type="button" style="height: 44px; padding: 0 16px; border: 0; border-radius: 9px; background: transparent; color: #F2F4F6; font: inherit; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px">
        <svg width="16" height="16" sc-camel-view-box="0 0 8 8" aria-hidden="true" shape-rendering="crispEdges"><rect x="1" y="0" width="6" height="1" fill="#FF8A3D"></rect><rect x="0" y="1" width="8" height="5" fill="#FF8A3D"></rect><rect x="2" y="2" width="1" height="1" fill="#0E1013"></rect><rect x="5" y="2" width="1" height="1" fill="#0E1013"></rect><rect x="1" y="6" width="2" height="2" fill="#FF8A3D"></rect><rect x="5" y="6" width="2" height="2" fill="#FF8A3D"></rect></svg>
        고수 모드
      </button>
    </div>
  </header>

  <div style="flex: 1; display: flex; min-height: 0">
    <section aria-label="지도" style="flex: 1; position: relative; overflow: hidden; background: #14171B">
      <svg width="880" height="728" sc-camel-view-box="0 0 880 728" aria-hidden="true" style="position: absolute; left: 0; top: 0">
        <rect width="880" height="728" fill="#14171B"></rect>
        <g fill="#191C21">
          <rect x="40" y="40" width="200" height="150" rx="6"></rect><rect x="290" y="40" width="240" height="150" rx="6"></rect><rect x="580" y="40" width="260" height="150" rx="6"></rect>
          <rect x="40" y="250" width="200" height="200" rx="6"></rect><rect x="290" y="250" width="240" height="200" rx="6"></rect><rect x="580" y="250" width="260" height="200" rx="6"></rect>
          <rect x="40" y="510" width="200" height="180" rx="6"></rect><rect x="290" y="510" width="240" height="180" rx="6"></rect><rect x="580" y="510" width="260" height="180" rx="6"></rect>
        </g>
        <g stroke="#262B33" stroke-width="22">
          <path d="M0 220H880"></path><path d="M0 480H880"></path><path d="M265 0V728"></path><path d="M555 0V728"></path>
        </g>
        <g stroke="#20242B" stroke-width="8">
          <path d="M140 0V728"></path><path d="M410 220V480"></path><path d="M700 0V728"></path><path d="M0 110H880"></path><path d="M0 600H880"></path>
        </g>
        <path d="M410 640V480H555V350H640" fill="none" stroke="#4C9BFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>

      <div aria-label="현재 위치" style="position: absolute; left: 392px; top: 622px; width: 36px; height: 36px; border-radius: 50%; background: rgba(76,155,255,0.25); display: flex; align-items: center; justify-content: center">
        <div style="width: 16px; height: 16px; border-radius: 50%; background: #4C9BFF; border: 3px solid #F2F4F6"></div>
      </div>

      <div style="position: absolute; left: 600px; top: 304px; display: flex; flex-direction: column; align-items: center; gap: 4px">
        <div style="display: flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 10px; background: #FF8A3D; color: #0E1013; font-size: 15px; font-weight: 700; box-shadow: 0 0 0 3px #0E1013">★ 4.5</div>
        <div style="padding: 3px 8px; background: #0E1013; border: 2px solid #FF8A3D; color: #FFB27F; font-weight: 700; font-size: 12px; letter-spacing: 0.5px">도전장</div>
      </div>
      <div style="position: absolute; left: 150px; top: 520px; padding: 8px 12px; border-radius: 10px; background: #F2F4F6; color: #0E1013; font-size: 15px; font-weight: 700; box-shadow: 0 0 0 3px #0E1013">★ 1.5</div>
      <div style="position: absolute; left: 330px; top: 140px; padding: 8px 12px; border-radius: 10px; background: #C9CED6; color: #0E1013; font-size: 15px; font-weight: 700; box-shadow: 0 0 0 3px #0E1013">★ 3.0</div>
      <div style="position: absolute; left: 720px; top: 560px; display: flex; flex-direction: column; align-items: center; gap: 4px">
        <div style="padding: 8px 12px; border-radius: 10px; background: #FF8A3D; color: #0E1013; font-size: 15px; font-weight: 700; box-shadow: 0 0 0 3px #0E1013">★ 5.0</div>
        <div style="padding: 3px 8px; background: #0E1013; border: 2px solid #FF8A3D; color: #FFB27F; font-weight: 700; font-size: 12px">도전장</div>
      </div>

      <div style="position: absolute; left: 24px; bottom: 24px; display: flex; align-items: center; gap: 16px; padding: 12px 16px; background: rgba(18,20,24,0.92); border: 1px solid #262A31; border-radius: 12px; font-size: 13px; color: #A9B0BA">
        <span style="color: #F2F4F6; font-weight: 500">주차 난이도</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #F2F4F6"></span>쉬움 ★1–2</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #C9CED6"></span>보통 ★3</span>
        <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #FF8A3D"></span>어려움 ★4–5</span>
      </div>
    </section>

    <aside aria-label="주변 주차장" style="width: 400px; box-sizing: border-box; background: #121418; border-left: 1px solid #262A31; padding: 20px; display: flex; flex-direction: column; gap: 12px; overflow: hidden">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h2 style="margin: 0; font-size: 18px; font-weight: 700">목적지 주변 4곳</h2>
        <span style="font-size: 13px; color: #A9B0BA">내 차 기준 난이도</span>
      </div>
      <div style="display: flex; gap: 8px">
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #F2F4F6; background: #F2F4F6; color: #0E1013; font: inherit; font-size: 13px; font-weight: 700">쉬운 순</button>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #3A404A; background: transparent; color: #F2F4F6; font: inherit; font-size: 13px">가까운 순</button>
        <button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #3A404A; background: transparent; color: #F2F4F6; font: inherit; font-size: 13px">제휴 할인</button>
      </div>
      <sc-for list="{{lots}}" as="lot" hint-placeholder-count="4">
        <a href="Detail.dc.html" style="display: flex; flex-direction: column; gap: 8px; padding: 16px; border-radius: 14px; background: #1A1D22; border: 1px solid #262A31; color: #F2F4F6; text-decoration: none">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
            <span style="font-size: 16px; font-weight: 700">{{lot.name}}</span>
            <span style="padding: 4px 10px; border-radius: 8px; font-size: 14px; font-weight: 700; background: {{lot.chipBg}}; color: #0E1013">★ {{lot.stars}}</span>
          </div>
          <div style="font-size: 13px; color: #A9B0BA">{{lot.meta}}</div>
          <div style="display: flex; gap: 6px; flex-wrap: wrap">
            <sc-for list="{{lot.tags}}" as="tag" hint-placeholder-count="2">
              <span style="padding: 3px 8px; border-radius: 6px; background: #22262D; color: #C9CED6; font-size: 12px">{{tag}}</span>
            </sc-for>
            <sc-if value="{{lot.challenge}}" hint-placeholder-val="{{false}}">
              <span style="padding: 3px 8px; background: #0E1013; border: 2px solid #FF8A3D; color: #FFB27F; font-weight: 700; font-size: 12px; line-height: 14px">도전장</span>
            </sc-if>
          </div>
        </a>
      </sc-for>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  renderVals() {
    return {
      lots: [
        { name: '새솔 공영주차장', stars: '1.5', chipBg: '#F2F4F6', meta: '도보 4분 · 30분 1,500원 · 제휴 사전결제', tags: ['평면', '면 폭 넓음'], challenge: false },
        { name: '누리타워 지하주차장', stars: '3.0', chipBg: '#C9CED6', meta: '도보 2분 · 30분 2,000원', tags: ['직선 경사로', '기둥 많음'], challenge: false },
        { name: '다온빌딩 부설주차장', stars: '4.5', chipBg: '#FF8A3D', meta: '건물 내 · 30분 2,500원 · 1998년 준공', tags: ['나선 경사로', '진입로 좁음'], challenge: true },
        { name: '한결 기계식 주차타워', stars: '5.0', chipBg: '#FF8A3D', meta: '도보 6분 · 30분 1,800원', tags: ['기계식', '대형 SUV 불가'], challenge: true }
      ]
    };
  }
}
</script>


</body></html>
