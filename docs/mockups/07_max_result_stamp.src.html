<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>결과 도장 획득</title>
<script src="228dd13b-5ee6-4c99-80da-2b0d4fee4b16"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Do+Hyeon&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFD23F}a:hover{color:#FFE27F}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #120D24; color: #F7F1E3; font-family: 'Noto Sans KR', sans-serif; display: flex; gap: 32px; padding: 40px; overflow: hidden">

  <section style="width: 440px; display: flex; flex-direction: column; align-items: center; gap: 20px">
    <span style="font-family: 'Press Start 2P', monospace; font-size: 22px; color: #FFD23F; text-align: center; line-height: 34px">DUNGEON<br>CLEAR!</span>
    <svg width="280" height="280" sc-camel-view-box="0 0 28 28" role="img" aria-label="다온빌딩 던전 클리어 도장" shape-rendering="crispEdges">
      <rect x="8" y="2" width="12" height="2" fill="#D9412B"></rect><rect x="5" y="4" width="3" height="2" fill="#D9412B"></rect><rect x="20" y="4" width="3" height="2" fill="#D9412B"></rect>
      <rect x="3" y="6" width="2" height="3" fill="#D9412B"></rect><rect x="23" y="6" width="2" height="3" fill="#D9412B"></rect>
      <rect x="2" y="9" width="2" height="10" fill="#D9412B"></rect><rect x="24" y="9" width="2" height="10" fill="#D9412B"></rect>
      <rect x="3" y="19" width="2" height="3" fill="#D9412B"></rect><rect x="23" y="19" width="2" height="3" fill="#D9412B"></rect>
      <rect x="5" y="22" width="3" height="2" fill="#D9412B"></rect><rect x="20" y="22" width="3" height="2" fill="#D9412B"></rect><rect x="8" y="24" width="12" height="2" fill="#D9412B"></rect>
      <rect x="9" y="7" width="10" height="2" fill="#D9412B"></rect><rect x="9" y="9" width="2" height="6" fill="#D9412B"></rect><rect x="11" y="9" width="5" height="2" fill="#D9412B"></rect><rect x="16" y="11" width="2" height="2" fill="#D9412B"></rect><rect x="11" y="13" width="5" height="2" fill="#D9412B"></rect>
      <rect x="7" y="18" width="2" height="2" fill="#FFD23F"></rect><rect x="13" y="17" width="2" height="2" fill="#FFD23F"></rect><rect x="19" y="18" width="2" height="2" fill="#FFD23F"></rect>
    </svg>
    <span style="font-family: 'Do Hyeon', sans-serif; font-size: 30px">다온빌딩 던전 도장 획득</span>
    <span style="font-size: 15px; color: #CFC6E8">도장 7개째 · 다음 칭호 '고수'까지 3개</span>
  </section>

  <section style="flex: 1; display: flex; flex-direction: column; gap: 14px">
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
      <div style="padding: 16px; background: #1B1430; border: 4px solid #FFD23F; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #CFC6E8">STARS</span><span style="font-family: 'Press Start 2P', monospace; font-size: 24px; color: #FFD23F">7/9</span></div>
      <div style="padding: 16px; background: #1B1430; border: 4px solid #F7F1E3; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #CFC6E8">CLEAR TIME</span><span style="font-family: 'Press Start 2P', monospace; font-size: 24px">38:40</span></div>
      <div style="padding: 16px; background: #1B1430; border: 4px solid #F7F1E3; display: flex; flex-direction: column; gap: 8px"><span style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #CFC6E8">RANK</span><span style="font-family: 'Press Start 2P', monospace; font-size: 24px">#7</span></div>
    </div>

    <sc-for list="{{stages}}" as="s" hint-placeholder-count="3">
      <div style="padding: 14px 18px; background: #1B1430; border: 3px solid #3B2F66; display: grid; grid-template-columns: 90px 1fr auto; align-items: center; gap: 16px">
        <span style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #FF8A3D">{{s.stage}}</span>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <span style="font-family: 'Do Hyeon', sans-serif; font-size: 21px">{{s.title}}</span>
          <span style="font-size: 13px; color: #CFC6E8">{{s.data}}</span>
        </div>
        <span style="font-family: 'Press Start 2P', monospace; font-size: 14px; color: #FFD23F">{{s.stars}}</span>
      </div>
    </sc-for>

    <div style="margin-top: auto; display: flex; gap: 12px">
      <button type="button" style="flex: 1; height: 64px; border: 0; background: #FFD23F; color: #120D24; box-shadow: 6px 6px 0 #B8860B; font-family: 'Do Hyeon', sans-serif; font-size: 22px">기록 공유</button>
      <button type="button" style="flex: 1; height: 64px; border: 4px solid #F7F1E3; background: transparent; color: #F7F1E3; font-family: 'Do Hyeon', sans-serif; font-size: 22px">도장 컬렉션</button>
      <a href="Main.dc.html" style="flex: 1; height: 64px; box-sizing: border-box; border: 4px solid #5B4BB7; color: #CFC6E8; font-family: 'Do Hyeon', sans-serif; font-size: 22px; text-decoration: none; display: flex; align-items: center; justify-content: center">일반 모드로</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  renderVals() {
    return {
      stages: [
        { stage: 'STAGE 1', title: '나선 경사로 무정지 통과', data: '경사로 정지 0회 · 최고 속도 8km/h', stars: '★★★' },
        { stage: 'STAGE 2', title: '기둥 숲 무경고 통과', data: '안전 경고 0회 · 급조향 1회', stars: '★★☆' },
        { stage: 'STAGE 3', title: '한 번에 후진 주차', data: '기어 전환 3회 (목표 2회 이내)', stars: '★★☆' }
      ]
    };
  }
}
</script>


</body></html>
