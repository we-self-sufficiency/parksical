<!DOCTYPE html>
<html lang="ko"><head>
<meta charset="utf-8">
<title>고수 모드 스테이지 맵</title>
<script src="ad42be9a-ee5e-4aba-965f-2d95dc80a20e"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=Do+Hyeon&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#FFD23F}a:hover{color:#FFE27F}
</style>
</helmet>
<div style="width: 1280px; height: 800px; box-sizing: border-box; background: #120D24; color: #F7F1E3; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <header style="height: 72px; box-sizing: border-box; padding: 0 24px; display: flex; align-items: center; gap: 20px; background: #1B1430; border-bottom: 4px solid #F7F1E3">
    <span style="font-family: 'Do Hyeon', sans-serif; font-size: 26px; color: #FFD23F">고수의 주차장</span>
    <span style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #CFC6E8; padding: 6px 8px; border: 2px solid #5B4BB7">LV.2 숙련</span>
    <span style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #CFC6E8">STAMP ×7</span>
    <div style="margin-left: auto; display: flex; border: 3px solid #F7F1E3">
      <button type="button" style="height: 44px; padding: 0 18px; border: 0; background: #1B1430; color: #CFC6E8; font-family: 'Do Hyeon', sans-serif; font-size: 18px">일반</button>
      <button type="button" style="height: 44px; padding: 0 18px; border: 0; background: #FFD23F; color: #120D24; font-family: 'Do Hyeon', sans-serif; font-size: 18px">고수 모드</button>
    </div>
  </header>

  <div style="flex: 1; display: flex; gap: 24px; padding: 24px; box-sizing: border-box; min-height: 0">
    <section aria-label="스테이지 맵" style="flex: 1; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: baseline; justify-content: space-between">
        <h1 style="margin: 0; font-family: 'Do Hyeon', sans-serif; font-size: 32px; font-weight: 400">다온빌딩 던전</h1>
        <span style="font-family: 'Press Start 2P', monospace; font-size: 11px; color: #FF8A3D">★★★★☆ HARD</span>
      </div>
      <div style="flex: 1; background: #0B0818; border: 4px solid #F7F1E3; box-shadow: 6px 6px 0 #5B4BB7; position: relative">
        <svg width="100%" height="100%" sc-camel-view-box="0 0 160 106" sc-camel-preserve-aspect-ratio="xMidYMid meet" role="img" aria-label="지하 4층 구조의 스테이지 맵: 입구, 나선 경사로, 기둥 구간, 목표 주차면" shape-rendering="crispEdges">
          <rect width="160" height="106" fill="#0B0818"></rect>
          <g fill="#241C44">
            <rect x="4" y="8" width="152" height="2"></rect><rect x="4" y="36" width="152" height="2"></rect><rect x="4" y="64" width="152" height="2"></rect><rect x="4" y="92" width="152" height="2"></rect>
          </g>
          <g fill="#2E2550">
            <rect x="8" y="12" width="40" height="20"></rect>
            <rect x="56" y="40" width="96" height="20"></rect>
            <rect x="8" y="68" width="144" height="20"></rect>
          </g>
          <g fill="#5B4BB7">
            <rect x="20" y="16" width="4" height="4"></rect><rect x="24" y="16" width="4" height="4"></rect><rect x="28" y="20" width="4" height="4"></rect><rect x="28" y="24" width="4" height="4"></rect><rect x="24" y="28" width="4" height="4"></rect><rect x="20" y="28" width="4" height="4"></rect><rect x="16" y="24" width="4" height="4"></rect><rect x="16" y="20" width="4" height="4"></rect>
          </g>
          <g fill="#F7F1E3">
            <rect x="70" y="42" width="4" height="4"></rect><rect x="86" y="54" width="4" height="4"></rect><rect x="102" y="42" width="4" height="4"></rect><rect x="118" y="54" width="4" height="4"></rect><rect x="134" y="42" width="4" height="4"></rect>
          </g>
          <g fill="#3B2F66">
            <rect x="96" y="70" width="2" height="16"></rect><rect x="108" y="70" width="2" height="16"></rect><rect x="120" y="70" width="2" height="16"></rect><rect x="132" y="70" width="2" height="16"></rect><rect x="144" y="70" width="2" height="16"></rect>
          </g>
          <rect x="122" y="72" width="10" height="14" fill="none" stroke="#FFD23F" stroke-width="1"></rect>
          <g fill="#FFD23F"><rect x="125" y="77" width="4" height="4"></rect></g>
          <g fill="#FF8A3D"><rect x="40" y="18" width="2" height="2"></rect><rect x="44" y="18" width="2" height="2"></rect><rect x="48" y="22" width="4" height="2"></rect><rect x="52" y="22" width="2" height="18"></rect><rect x="54" y="46" width="2" height="2"></rect><rect x="150" y="56" width="2" height="12"></rect><rect x="146" y="76" width="4" height="2"></rect></g>
          <g>
            <rect x="9" y="22" width="8" height="5" fill="#FF8A3D"></rect><rect x="10" y="20" width="5" height="2" fill="#FFB27F"></rect><rect x="10" y="27" width="2" height="2" fill="#F7F1E3"></rect><rect x="14" y="27" width="2" height="2" fill="#F7F1E3"></rect>
          </g>
        </svg>
        <span style="position: absolute; left: 12px; top: 10px; font-family: 'Press Start 2P', monospace; font-size: 10px; color: #CFC6E8">B1 입구</span>
        <span style="position: absolute; left: 12px; top: 37%; font-family: 'Press Start 2P', monospace; font-size: 10px; color: #CFC6E8">B2</span>
        <span style="position: absolute; left: 12px; top: 63%; font-family: 'Press Start 2P', monospace; font-size: 10px; color: #CFC6E8">B3</span>
        <span style="position: absolute; left: 22%; top: 10px; padding: 4px 8px; background: #5B4BB7; font-family: 'Do Hyeon', sans-serif; font-size: 16px">STAGE 1 나선 경사로</span>
        <span style="position: absolute; left: 48%; top: 31%; padding: 4px 8px; background: #F7F1E3; color: #120D24; font-family: 'Do Hyeon', sans-serif; font-size: 16px">STAGE 2 기둥 숲</span>
        <span style="position: absolute; right: 18%; bottom: 8px; padding: 4px 8px; background: #FFD23F; color: #120D24; font-family: 'Do Hyeon', sans-serif; font-size: 16px">STAGE 3 목표 주차면</span>
      </div>
    </section>

    <aside aria-label="미션" style="width: 380px; display: flex; flex-direction: column; gap: 14px">
      <div style="padding: 16px; background: #1B1430; border: 4px solid #FFD23F; display: flex; align-items: center; justify-content: space-between">
        <span style="font-family: 'Press Start 2P', monospace; font-size: 12px; color: #CFC6E8">TIME</span>
        <span style="font-family: 'Press Start 2P', monospace; font-size: 26px; color: #FFD23F">60:00</span>
      </div>
      <sc-for list="{{missions}}" as="m" hint-placeholder-count="3">
        <div style="padding: 14px 16px; background: #1B1430; border: 3px solid #3B2F66; display: flex; flex-direction: column; gap: 6px">
          <div style="display: flex; justify-content: space-between; align-items: center">
            <span style="font-family: 'Press Start 2P', monospace; font-size: 10px; color: #FF8A3D">{{m.stage}}</span>
            <span style="font-family: 'Press Start 2P', monospace; font-size: 11px; color: #6E6490">☆☆☆</span>
          </div>
          <span style="font-family: 'Do Hyeon', sans-serif; font-size: 22px">{{m.title}}</span>
          <span style="font-size: 13px; color: #CFC6E8">{{m.rule}}</span>
        </div>
      </sc-for>
      <div style="margin-top: auto; padding: 14px 16px; background: #241426; border: 3px solid #FF8A3D; font-size: 14px; line-height: 21px; color: #F7F1E3">
        <strong style="color: #FFB27F">P단 정차 중.</strong> 기어를 바꾸면 화면이 최소 표시로 전환되고 판정이 시작됩니다.
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800}}">
class Component extends DCLogic {
  renderVals() {
    return {
      missions: [
        { stage: 'STAGE 1', title: '나선 경사로 무정지 통과', rule: '경사로 구간에서 정지 0회 · 속도·브레이크로 판정' },
        { stage: 'STAGE 2', title: '기둥 숲 무경고 통과', rule: '차량 안전 경고 0회 · 급조향 없이' },
        { stage: 'STAGE 3', title: '한 번에 후진 주차', rule: '지정 면에 기어 전환 2회 이내로 P단 체결' }
      ]
    };
  }
}
</script>


</body></html>
